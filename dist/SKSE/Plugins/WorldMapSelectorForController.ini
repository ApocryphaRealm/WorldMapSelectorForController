[General]
; Valid levels: Trace, Debug, Info, Warn, Err, Critical, Off
LogLevel=Info

[Controls]
; The map chooser opens from the world map only. Outside the map these do nothing.
;
; Keyboard key, as a DirectInput scan code in hexadecimal (0x00 through 0xFF).
; Key code reference: https://community.bistudio.com/wiki/DIK_KeyCodes
; 0x2E is C. Set to 0x00 to turn the keyboard key off.
MapMenuKey=0x2E

; Controller button, as an XInput button mask in hexadecimal.
; 0x0001 D-pad up, 0x0002 D-pad down, 0x0004 D-pad left, 0x0008 D-pad right,
; 0x0010 Start, 0x0020 Back, 0x0040 left stick click, 0x0080 right stick click,
; 0x0100 left bumper, 0x0200 right bumper, 0x1000 A, 0x2000 B, 0x4000 X, 0x8000 Y.
; 0x0001 (D-pad up) is unused by the vanilla world map. Set to 0x0000 to turn the button off.
MapMenuButton=0x0001

[Behavior]
; Keep an explicit map selection after MapMenu closes.
; When false, the selection applies to one map session.
PersistSelection=true

; Show the chooser's key or button in compatible MapMenu interfaces (SkyUI's button bar).
; The hint shows the controller button while a controller is in use, the keyboard key otherwise.
ShowMapMenuKeyHint=true

; Show the SkyUI key hint while viewing the local map.
; Disabled by default to avoid overlapping hints added by local-map mods.
ShowMapMenuKeyHintOnLocalMap=false

; Number of worldspaces shown on each chooser page.
; Valid values are 1 through 7. Use a smaller value if the chooser exceeds the screen.
MapsPerPage=6

; Show a visible Cancel button in the chooser.
; Escape, Tab, and controller Cancel inputs still close the chooser when disabled.
ShowCancelButton=true

; Show the option that returns map selection to Skyrim.
; When disabled, every chooser choice explicitly selects a map. Persistent selections
; cannot be cleared through the chooser until this option is re-enabled.
ShowClearSelectionButton=true

[Compatibility]
; Comma-separated worldspace EditorIDs to include in the map chooser.
; Matching is case-insensitive. Leave the value empty to include every valid map.
IncludedWorldspaces=

; Comma-separated worldspace EditorIDs to omit from the map chooser.
; Matching is case-insensitive. Exclusions take priority over inclusions.
; Leave the value empty to exclude no worldspaces.
;
; Opening Falskaar remotely can prevent later world transitions from completing.
ExcludedWorldspaces=Falskaar
